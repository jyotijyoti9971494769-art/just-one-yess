<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just One Yes 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,800;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#f6e9f4;--bg2:#e9f1fb;--card:rgba(255,255,255,.78);--ink:#0f172a;--rose:#e11d63;
  --rose2:#ff2d78;--soft:#eaf3fb;--muted:#9aa8bd;--pill:#fde8ef;--frame:#f4f8fd;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1530;--bg2:#13203a;--card:rgba(30,30,50,.8);--ink:#f1f5f9;--soft:#243049;--frame:#1c2540;--pill:#4a1f33;--muted:#8391ab}}
:root[data-theme="dark"]{--bg1:#2a1530;--bg2:#13203a;--card:rgba(30,30,50,.8);--ink:#f1f5f9;--soft:#243049;--frame:#1c2540;--pill:#4a1f33;--muted:#8391ab}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));background-color:var(--bg1);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px;overflow-x:hidden}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.fl{position:absolute;bottom:-40px;animation:rise linear forwards;opacity:.85}
@keyframes rise{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
#music{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:5;border:0;background:rgba(255,255,255,.75);color:var(--rose);font:600 14px 'Poppins';padding:10px 18px;border-radius:999px;cursor:pointer;box-shadow:0 4px 14px rgba(180,120,160,.18);backdrop-filter:blur(8px)}
.card{position:relative;z-index:2;width:100%;max-width:420px;background:var(--card);backdrop-filter:blur(14px);border-radius:30px;padding:30px 24px 24px;text-align:center;box-shadow:0 20px 50px rgba(150,110,170,.18);transition:transform .4s}
.badge{display:inline-block;background:var(--pill);color:var(--rose);font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:7px 18px;border-radius:999px}
.frame{position:relative;margin:18px auto 22px;width:100%;max-width:300px;height:230px;background:var(--frame);border-radius:20px;border:1px solid rgba(225,29,99,.08);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px}
.frame img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;animation:pop .45s}
.frame video{max-width:100%;max-height:100%;border-radius:8px;animation:pop .45s}
.frame .em{font-size:96px;animation:pop .45s}
.frame .h{position:absolute;top:8px;right:10px;font-size:22px;animation:beat 1.2s infinite}
.frame .s{position:absolute;bottom:8px;left:10px;font-size:18px;animation:twinkle 2s infinite}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes beat{50%{transform:scale(1.25)}}
@keyframes twinkle{50%{opacity:.3}}
h1{font-size:28px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.sub{margin-top:10px;font-style:italic;font-weight:500;color:var(--rose);font-size:15px;line-height:1.5}
.btns{position:relative;display:flex;justify-content:center;align-items:center;gap:14px;margin-top:26px;min-height:62px}
.btn{border:0;font:800 18px 'Poppins';border-radius:18px;padding:16px 30px;cursor:pointer;transition:transform .25s,box-shadow .25s}
#yes{background:linear-gradient(135deg,var(--rose2),#d4105a);color:#fff;box-shadow:0 10px 24px rgba(255,45,120,.35)}
#yes:hover{transform:scale(1.06)}
#no{background:var(--soft);color:#475b7a;font-weight:600;font-size:17px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.foot{margin-top:20px;font-size:13px;color:var(--muted);font-weight:500}
.foot.red{color:var(--rose);font-size:11.5px}
.tip{position:absolute;left:50%;top:-40px;transform:translateX(-50%);background:var(--card);padding:7px 14px;border-radius:12px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.1);opacity:0;pointer-events:none;transition:opacity .2s}
.tip.on{opacity:1}
#win{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(255,230,240,.45);backdrop-filter:blur(8px);padding:20px}
#win.on{display:flex}
.win{width:100%;max-width:340px;background:#fff;color:#0f172a;border:3px solid #f9a8c0;border-radius:24px;padding:26px 22px;text-align:center;animation:pop .5s;box-shadow:0 24px 60px rgba(225,29,99,.25)}
.win .ph{width:130px;height:130px;margin:0 auto 14px;border-radius:22px;overflow:hidden;background:var(--frame);display:flex;align-items:center;justify-content:center;font-size:60px;border:2px solid #fde8ef}
.win .ph video,.win .ph img{width:100%;height:100%;object-fit:cover}
.win h2{font-size:26px;font-weight:800;color:#e11d63}
.win .sc{font:400 28px 'Great Vibes',cursive;color:#f472a0;margin:4px 0 8px}
.win p{font-size:14px;color:#64748b;line-height:1.55}
#again{margin-top:16px;border:0;background:#ec4a7e;color:#fff;font:600 14px 'Poppins';padding:10px 24px;border-radius:12px;cursor:pointer}
#cf{position:fixed;inset:0;z-index:11;pointer-events:none}
@media (prefers-reduced-motion:reduce){.fl,.frame .h,.frame .s{animation:none}}
</style>
</head>
<body>
<div id="hearts"></div>
<button id="music">🎵 Play Music</button>
<main class="card" id="card">
  <span class="badge">A message straight from the heart</span>
  <div class="frame" id="frame"></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="btns" id="btns">
    <div class="tip" id="tip"></div>
    <button class="btn" id="yes">Yes! 💍</button>
    <button class="btn" id="no"></button>
  </div>
  <p class="foot" id="foot"></p>
</main>
<div id="win"><div class="win">
  <div class="ph" id="wph"></div>
  <h2>Yaaay! I Knew It! 🎉</h2>
  <div class="sc">Forever &amp; Always</div>
  <p>You just made me the happiest person in the universe! I promise to love you endlessly. 💗💍✨</p>
  <button id="again">Play Again ↺</button>
</div></div>
<canvas id="cf"></canvas>

const MUSIC_URL = ''; // apna mp3 link; khaali = built-in soft melody
const FALL = ['💖','💗','💕','✨','🌸','💘'];
// ====== STAGES ======
const ST = [
 {k:'s0',em:'💌',t:'Do you love me? 🥰',s:'My heart beats only for you... ❤️',no:'No 🥺',f:'Choose honestly with all your heart ✨'},
 {k:'s1',em:'🐱',t:'Please think again! 🤔',s:'Take a deep breath... Don’t break my heart so fast 💔',no:'Still No 🥹',f:'Choose honestly with all your heart ✨'},
 {k:'s2',em:'😭',t:'Ek aur baar soch lo na! 🥺',s:'Kyu aisa kar rahi ho... Are you really sure? 🥹💔',no:'No way 🙅',f:'Choose honestly with all your heart ✨'},
 {k:'s3',em:'🙏',t:'Baby, please agree now! Kitna bhav khaogi 😭',s:'Bahut galat baat hai yaar 💔🥹 Stop teasing me now!',no:'No 😤',run:true,f:'Dekho No button toh bhagne laga hai! Ab toh sirf ‘Yes’ hi bacha hai! 😏'}
];
const TIPS = ['Pakad ke dikhao! 😏😜','No nahi bol sakte! 🙅‍♂️😤','Maan jao na! 💖🥰','Itna mat satao! 🥺','Yes dabao na! 💍'];
const $ = id => document.getElementById(id);
let i = 0, tries = 0, scale = 1;

function media(url, em){ if (url.startsWith('data:video')) return `<video src="${url}" autoplay loop muted playsinline></video>`; return url ? `<img src="${url}" alt="" onerror="this.outerHTML='<div class=em>${em}</div>'">` : `<div class="em">${em}</div>`; }
function render(){
  const s = ST[i];
  $('frame').innerHTML = media(IMG[s.k], s.em) + '<span class="h">💖</span><span class="s">✨</span>';
  $('title').textContent = s.t; $('sub').textContent = s.s; $('no').textContent = s.no;
  $('foot').textContent = s.f; $('foot').className = 'foot' + (s.run ? ' red' : '');
  $('no').style.transform = ''; $('yes').style.transform = ''; scale = 1; tries = 0;
  onStage();
}
function run(){
  const c = $('card').getBoundingClientRect(), b = $('no');
  const x = (Math.random() - .5) * (c.width - 140), y = (Math.random() - .5) * 240;
  b.style.transform = `translate(${x}px,${y}px)`;
  const t = $('tip'); t.textContent = TIPS[tries % TIPS.length]; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 1300);
  tries++; scale = Math.min(scale + .12, 1.7); $('yes').style.transform = `scale(${scale})`;
}
$('no').addEventListener('click', () => { if (ST[i].run) return run(); i++; render(); });
['mouseenter','touchstart'].forEach(e => $('no').addEventListener(e, ev => { if (ST[i].run) { ev.preventDefault(); run(); } }, {passive:false}));
$('yes').addEventListener('click', () => {
  $('wph').innerHTML = media(IMG.win, '👶');
  const v = $('wph').querySelector('video');
  if (v) { v.muted = false; v.volume = 1; v.play().catch(() => { v.muted = true; v.play(); }); }
  au.pause(); stopSynth();
  $('win').classList.add('on'); boom();
});
$('again').addEventListener('click', () => { $('win').classList.remove('on'); i = 0; render(); });

// ====== floating hearts ======
setInterval(() => {
  const d = document.createElement('div'); d.className = 'fl';
  d.textContent = FALL[Math.random() * FALL.length | 0];
  d.style.left = Math.random() * 100 + 'vw'; d.style.fontSize = 12 + Math.random() * 20 + 'px';
  d.style.animationDuration = 6 + Math.random() * 6 + 's';
  $('hearts').appendChild(d); setTimeout(() => d.remove(), 12500);
}, 450);

// ====== confetti ======
function boom(){
  const cv = $('cf'), x = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#ff2d78','#ffd23f','#3bceac','#6a4cff','#ff8c42','#4cc9f0'];
  const p = Array.from({length:160}, () => ({x:cv.width/2, y:cv.height/2, vx:(Math.random()-.5)*16, vy:Math.random()*-16-2, r:Math.random()*6+3, c:cols[Math.random()*6|0], a:1}));
  (function f(){
    x.clearRect(0,0,cv.width,cv.height); let live = 0;
    p.forEach(q => { q.vy += .35; q.x += q.vx; q.y += q.vy; q.a -= .006; if (q.a > 0){ live++; x.globalAlpha = q.a; x.fillStyle = q.c; x.fillRect(q.x, q.y, q.r, q.r*1.6); } });
    if (live) requestAnimationFrame(f); else x.clearRect(0,0,cv.width,cv.height);
  })();
}

// ====== music: har stage ka apna Bollywood song ======
// Apni mp3 files ke naam/link yahan daalo (khaali = soft built-in melody)
const SONGS = {
  s0:'',  // 🥰 Do you love me?      -> e.g. Tujhe Dekha Toh Ye Jaana Sanam
  s1:'',  // 🤔 Please think again!  -> e.g. Tum Se Hi
  s2:'',  // 🥺 Ek aur baar soch lo  -> e.g. Channa Mereya
  s3:''   // 😭 Baby please agree    -> e.g. Dil Diyan Gallan
};
const au = new Audio(); au.loop = true;
let ctx = null, tm = null, on = false, cur = '';
function stopSynth(){ clearInterval(tm); tm = null; }
function synth(){
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  const n = [523,659,784,659,587,698,880,698]; let k = 0;
  tm = setInterval(() => {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = n[k++ % n.length];
    g.gain.setValueAtTime(.12, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .6);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .6);
  }, 480);
}
function playStage(){
  stopSynth(); au.pause();
  if (!on) return;
  const u = SONGS[ST[i].k];
  if (u) { if (cur !== u) { au.src = u; cur = u; } au.currentTime = 0; au.play().catch(() => {}); }
  else synth();
}
function onStage(){ if (on) playStage(); }
$('music').addEventListener('click', () => {
  on = !on; $('music').textContent = on ? '⏸ Pause Music' : '🎵 Play Music';
  if (on) playStage(); else { au.pause(); stopSynth(); }
});
render();
</script>
